# ─────────────────────────────────────────────
#  Crypto Futures Trading Bot – Configuration
# ─────────────────────────────────────────────

# Exchange settings
exchange:
  name: bybit          # ccxt exchange id (bybit | binanceusdm | okx | …)
  testnet: true        # use testnet / paper trading when true
  leverage: 10         # default leverage for all symbols
  margin_mode: cross   # cross | isolated

# Symbols to trade (futures perpetual swap pairs)
symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT

# Timeframes used by strategies
timeframes:
  primary: 1h          # main signal timeframe (override with PRIMARY_TIMEFRAME env var)
  htf: 4h              # higher-timeframe trend filter
  ltf: 15m             # lower-timeframe entry precision

# ── Risk Management ────────────────────────────────────────────────────────
risk:
  max_risk_per_trade: 0.01      # 1 % of account equity per trade
  max_open_positions: 4         # hard cap on concurrent positions
  max_daily_drawdown: 0.05      # halt trading if daily DD exceeds 5 %
  max_total_drawdown: 0.15      # halt trading if total DD exceeds 15 %
  reward_risk_ratio: 2.5        # minimum R:R required to enter
  atr_sl_multiplier: 1.5        # stop-loss = entry ± ATR × multiplier
  atr_tp_multiplier: 3.0        # take-profit = entry ± ATR × multiplier (overridden by R:R)
  trailing_stop_activation: 1.5 # activate trailing stop after price moves 1.5×ATR in profit
  trailing_stop_distance: 1.0   # trailing stop distance in ATR units

# ── Strategy Parameters ────────────────────────────────────────────────────
strategies:
  # Which strategies to run (at least one must agree to trigger an entry)
  enabled:
    - pullback
    - support_resistance
    - dca_fibonacci

  # Minimum number of strategies that must agree (consensus filter)
  min_confluence: 1

  pullback:
    fast_ema: 21
    slow_ema: 55
    trend_ema: 200
    rsi_period: 14
    rsi_oversold: 40      # long pullback: RSI below this level
    rsi_overbought: 60    # short pullback: RSI above this level
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9

  support_resistance:
    pivot_lookback: 20    # candles left/right to confirm a swing pivot
    zone_tolerance: 0.003 # 0.3 % price buffer around S/R level
    min_touches: 2        # minimum touches to validate a S/R zone
    adx_period: 14
    adx_threshold: 20     # minimum ADX to trade (avoid choppy markets)

  dca_fibonacci:
    # Fibonacci retracement levels used for DCA entries
    fib_levels: [0.382, 0.5, 0.618, 0.786]
    # Weight of each DCA layer (must sum to 1.0)
    fib_weights: [0.4, 0.3, 0.2, 0.1]
    swing_lookback: 50    # candles to look back for swing high/low
    rsi_period: 14
    rsi_filter_long: 50   # RSI must be above this for long DCA entries
    rsi_filter_short: 50  # RSI must be below this for short DCA entries

# ── Indicator Defaults ─────────────────────────────────────────────────────
indicators:
  atr_period: 14
  bb_period: 20
  bb_std: 2
  stochrsi_period: 14
  stochrsi_smooth_k: 3
  stochrsi_smooth_d: 3
  volume_ma_period: 20

# ── Bot Loop ───────────────────────────────────────────────────────────────
bot:
  poll_interval_seconds: 60   # how often to refresh market data
  dry_run: true               # true = log signals only, do NOT place real orders

# ── Telegram notifications ─────────────────────────────────────────────────
telegram:
  bot_token: ""      # set via TELEGRAM_BOT_TOKEN env var
  channel_id: ""     # set via TELEGRAM_CHANNEL_ID env var (e.g. @mychannel or -100…)

# ── Position-finder settings (python main.py --find-positions) ─────────────
find_positions:
  max_coins: 20                   # scan up to this many top-volume USDT perp symbols
  leverage: 20                    # displayed leverage in trade cards (×20 Cross)
  scan_interval_seconds: 300      # how often to look for new signals (5 min)
  monitor_interval_seconds: 30    # how often to check entry / TP / SL hits
